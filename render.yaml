services:
  - type: web
    name: meru-lead-manager
    runtime: node
    plan: starter
    buildCommand: npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5001
      - key: DB_PATH
        value: /var/data/leads.db
      - key: CLIENT_URL
        value: https://meru-lead-manager.onrender.com
      - key: JWT_SECRET
        generateValue: true
    disk:
      name: leads-data
      mountPath: /var/data
      sizeGB: 1
